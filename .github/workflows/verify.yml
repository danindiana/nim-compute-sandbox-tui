name: verify
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y graphviz sqlite3
      - name: Build
        run: nim c --hints:off -d:release -o:src/sandbox_tui src/sandbox_tui.nim
      - name: Build egress proxy
        run: nim c --hints:off -d:ssl -d:release -o:src/egress_proxy src/egress_proxy.nim
      - name: Smoke test (python, js, sql, net guard, timeout)
        run: tests/smoke.sh
      - name: Egress proxy end-to-end tests
        run: python3 tests/proxy_test.py
      - name: Diagrams render
        run: ./render.sh
